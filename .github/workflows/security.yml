name: security

# Kjører på hver push til main og på alle pull requests.
# CASA-punktet «npm audit i CI»: produksjonsavhengigheter skal ikke ha kjente
# sårbarheter i høy eller kritisk alvorlighetsgrad.
#
# Merk: vi sjekker bare produksjonsavhengigheter (--omit=dev). Byggeverktøy
# (drizzle-kit osv.) rapporteres av Dependabot, men blokkerer ikke bygget,
# siden de aldri kjører i produksjon.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm audit (produksjon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Agent - production dependencies
        run: |
          npm ci --omit=dev --ignore-scripts
          npm audit --omit=dev --audit-level=high

      - name: Web app - production dependencies
        working-directory: web
        run: |
          npm ci --omit=dev --ignore-scripts
          npm audit --omit=dev --audit-level=high

      - name: No env file is tracked by git
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.example$'; then
            echo "::error::An .env file is tracked by git - remove it and rotate the secret"
            exit 1
          fi
          echo "OK - no .env file is tracked"
