# Dependabot — holder avhengighetene oppdatert og varsler om sårbarheter.
# Dette dekker CASA-punktet «npm audit i CI + automatiske avhengighetsoppdateringer».
version: 2
updates:
  # Agenten (rot)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Oslo
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
    groups:
      agent-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Web-appen
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Oslo
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
    groups:
      web-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    commit-message:
      prefix: "ci"
